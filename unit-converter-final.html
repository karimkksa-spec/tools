<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محوّل القياسات الشامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #f7f8fc;
    color: #1a1a2e;
    padding: 1.5rem 1rem;
    min-height: 100vh;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* Header */
  .hdr { text-align: center; margin-bottom: 1.5rem; }
  .hdr h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; margin-bottom: 5px; }
  .hdr h1 span { color: #4a7af5; }
  .hdr p { font-size: 13px; color: #888; }

  /* Category buttons */
  .cats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.4rem;
  }
  .cats button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 15px;
    border-radius: 25px;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    color: #555;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .cats button:hover { border-color: #4a7af5; color: #4a7af5; background: #f0f4ff; }
  .cats button.active { background: #4a7af5; border-color: #4a7af5; color: #fff; }

  /* Cards */
  .card {
    background: #fff;
    border: 1.5px solid #e8e8f0;
    border-radius: 16px;
    padding: 1.4rem;
    margin-bottom: 1rem;
    box-shadow: 0 2px 12px rgba(74,122,245,0.06);
  }

  /* Converter row */
  .conv-row {
    display: grid;
    grid-template-columns: 1fr 50px 1fr;
    gap: 12px;
    align-items: end;
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: #999;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input[type=number] {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 20px;
    font-family: 'Courier New', monospace;
    font-weight: 600;
    color: #1a1a2e;
    background: #fafafa;
    outline: none;
    transition: border-color .2s;
    -moz-appearance: textfield;
  }
  .field input[type=number]::-webkit-outer-spin-button,
  .field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .field input[type=number]:focus { border-color: #4a7af5; background: #fff; }
  .field select {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 8px 11px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    color: #333;
    background: #fafafa;
    outline: none;
    margin-top: 6px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .field select:focus { border-color: #4a7af5; }

  /* Swap button */
  .swap-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    color: #666;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2px;
    transition: all .2s;
    flex-shrink: 0;
  }
  .swap-btn:hover { background: #4a7af5; color: #fff; border-color: #4a7af5; transform: rotate(180deg); }

  /* Result bar */
  .result-bar {
    background: linear-gradient(135deg, #f0f4ff, #e8f8f4);
    border: 1.5px solid #c5d5fb;
    border-radius: 10px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 56px;
  }
  .result-txt {
    font-size: 15px;
    font-weight: 600;
    color: #2a4ab5;
    flex: 1;
    word-break: break-all;
  }
  .copy-btn {
    border: 1.5px solid #c5d5fb;
    border-radius: 8px;
    background: #fff;
    color: #4a7af5;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .copy-btn:hover { background: #4a7af5; color: #fff; }

  /* Quick grid */
  .ql { font-size: 12px; color: #bbb; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 10px; }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; }
  .qcard {
    border: 1.5px solid #ececec;
    border-radius: 10px;
    padding: 10px 13px;
    cursor: pointer;
    background: #fafafa;
    transition: all .15s;
  }
  .qcard:hover { border-color: #4a7af5; background: #f0f4ff; transform: translateY(-1px); }
  .qu { font-size: 11px; color: #bbb; margin-bottom: 3px; font-weight: 500; }
  .qv { font-size: 14px; font-weight: 700; color: #1a1a2e; font-family: 'Courier New', monospace; }

  /* Footer */
  .footer { text-align: center; font-size: 12px; color: #ccc; margin-top: 1rem; }

  @media (max-width: 500px) {
    .conv-row { grid-template-columns: 1fr 40px 1fr; gap: 7px; }
    .swap-btn { width: 38px; height: 38px; font-size: 16px; }
    .field input[type=number] { font-size: 16px; padding: 9px 10px; }
    .hdr h1 { font-size: 20px; }
    .cats button { font-size: 12px; padding: 6px 11px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <h1>⚡ محوّل <span>القياسات</span> الشامل</h1>
    <p>أكثر من 120 وحدة قياس في 13 تصنيفاً</p>
  </div>

  <div class="cats" id="cats"></div>

  <div class="card">
    <div class="conv-row">
      <div class="field">
        <label>من</label>
        <input type="number" id="fv" value="1" oninput="go()">
        <select id="fu" onchange="go()"></select>
      </div>
      <button class="swap-btn" onclick="sw()" title="تبديل">⇄</button>
      <div class="field">
        <label>إلى</label>
        <input type="number" id="tv" oninput="goR()">
        <select id="tu" onchange="go()"></select>
      </div>
    </div>
    <div class="result-bar">
      <div class="result-txt" id="rt">أدخل قيمة للتحويل</div>
      <button class="copy-btn" onclick="cp()">📋 نسخ</button>
    </div>
  </div>

  <div class="card">
    <div class="ql">تحويلات سريعة</div>
    <div class="quick-grid" id="qg"></div>
  </div>

  <div class="footer">جميع التحويلات دقيقة علمياً · العملات تقريبية</div>
</div>

<script>
var D=[
{id:"length",lb:"📏 الطول",u:[{id:"m",l:"متر",f:1},{id:"km",l:"كيلومتر",f:1e3},{id:"cm",l:"سنتيمتر",f:.01},{id:"mm",l:"ملليمتر",f:.001},{id:"mi",l:"ميل",f:1609.344},{id:"yd",l:"ياردة",f:.9144},{id:"ft",l:"قدم",f:.3048},{id:"in",l:"بوصة",f:.0254},{id:"nm",l:"ميل بحري",f:1852},{id:"ly",l:"سنة ضوئية",f:9.461e15},{id:"au",l:"وحدة فلكية",f:1.496e11}]},
{id:"weight",lb:"⚖️ الوزن",u:[{id:"kg",l:"كيلوغرام",f:1},{id:"g",l:"غرام",f:.001},{id:"mg",l:"ملليغرام",f:1e-6},{id:"t",l:"طن متري",f:1e3},{id:"lb",l:"رطل",f:.453592},{id:"oz",l:"أونصة",f:.0283495},{id:"st",l:"ستون",f:6.35029},{id:"carat",l:"قيراط",f:.0002},{id:"grain",l:"حبة",f:6.48e-5}]},
{id:"temp",lb:"🌡️ الحرارة",u:[{id:"c",l:"مئوية °C"},{id:"f",l:"فهرنهايت °F"},{id:"k",l:"كلفن K"},{id:"r",l:"رانكين °R"}]},
{id:"area",lb:"📐 المساحة",u:[{id:"m2",l:"متر مربع",f:1},{id:"km2",l:"كيلومتر مربع",f:1e6},{id:"cm2",l:"سنتيمتر مربع",f:1e-4},{id:"ha",l:"هكتار",f:1e4},{id:"ac",l:"فدان",f:4046.856},{id:"ft2",l:"قدم مربع",f:.092903},{id:"in2",l:"بوصة مربعة",f:6.4516e-4},{id:"mi2",l:"ميل مربع",f:2.59e6}]},
{id:"volume",lb:"🧪 الحجم",u:[{id:"l",l:"لتر",f:1},{id:"ml",l:"ملليلتر",f:.001},{id:"m3",l:"متر مكعب",f:1e3},{id:"gal_us",l:"غالون أمريكي",f:3.78541},{id:"gal_uk",l:"غالون بريطاني",f:4.54609},{id:"qt",l:"كوارت",f:.946353},{id:"cup",l:"كوب",f:.236588},{id:"tbsp",l:"ملعقة كبيرة",f:.0147868},{id:"tsp",l:"ملعقة صغيرة",f:.00492892},{id:"barrel",l:"برميل نفط",f:158.987}]},
{id:"speed",lb:"🚀 السرعة",u:[{id:"mps",l:"م/ثانية",f:1},{id:"kph",l:"كم/ساعة",f:1/3.6},{id:"mph",l:"ميل/ساعة",f:.44704},{id:"knot",l:"عقدة بحرية",f:.514444},{id:"fps",l:"قدم/ثانية",f:.3048},{id:"mach",l:"ماخ",f:340.29},{id:"light",l:"سرعة الضوء",f:299792458}]},
{id:"time",lb:"⏱️ الوقت",u:[{id:"s",l:"ثانية",f:1},{id:"ms",l:"ملليثانية",f:.001},{id:"min",l:"دقيقة",f:60},{id:"hr",l:"ساعة",f:3600},{id:"day",l:"يوم",f:86400},{id:"week",l:"أسبوع",f:604800},{id:"month",l:"شهر",f:2.628e6},{id:"year",l:"سنة",f:3.156e7},{id:"century",l:"قرن",f:3.156e9}]},
{id:"digital",lb:"💾 البيانات",u:[{id:"b",l:"بت",f:1},{id:"B",l:"بايت",f:8},{id:"KB",l:"كيلوبايت",f:8192},{id:"MB",l:"ميغابايت",f:8.389e6},{id:"GB",l:"غيغابايت",f:8.59e9},{id:"TB",l:"تيرابايت",f:8.796e12},{id:"Mbps",l:"ميغابت/ث",f:1e6},{id:"Gbps",l:"غيغابت/ث",f:1e9}]},
{id:"energy",lb:"⚡ الطاقة",u:[{id:"j",l:"جول",f:1},{id:"kj",l:"كيلوجول",f:1e3},{id:"cal",l:"سعر حراري",f:4.184},{id:"kcal",l:"كيلوسعر",f:4184},{id:"kwh",l:"كيلوواط·ساعة",f:3.6e6},{id:"btu",l:"BTU",f:1055.06},{id:"ft_lb",l:"قدم·رطل",f:1.35582}]},
{id:"pressure",lb:"🔵 الضغط",u:[{id:"pa",l:"باسكال",f:1},{id:"kpa",l:"كيلوباسكال",f:1e3},{id:"bar",l:"بار",f:1e5},{id:"atm",l:"ضغط جوي",f:101325},{id:"psi",l:"PSI",f:6894.76},{id:"mmhg",l:"ملم زئبق",f:133.322}]},
{id:"angle",lb:"📡 الزوايا",u:[{id:"deg",l:"درجة",f:1},{id:"rad",l:"راديان",f:180/Math.PI},{id:"grad",l:"غراد",f:.9},{id:"turn",l:"دورة كاملة",f:360},{id:"arcmin",l:"دقيقة قوس",f:1/60},{id:"arcsec",l:"ثانية قوس",f:1/3600}]},
{id:"fuel",lb:"⛽ الوقود",u:[{id:"lp100",l:"لتر/100كم"},{id:"mpg_us",l:"ميل/غالون أمريكي"},{id:"mpg_uk",l:"ميل/غالون بريطاني"},{id:"km_l",l:"كم/لتر"}]},
{id:"currency",lb:"💰 العملات",u:[{id:"usd",l:"دولار $",f:1},{id:"sar",l:"ريال سعودي",f:.2666},{id:"eur",l:"يورو €",f:1.08},{id:"gbp",l:"جنيه £",f:1.27},{id:"aed",l:"درهم إماراتي",f:.2722},{id:"egp",l:"جنيه مصري",f:.0204},{id:"jod",l:"دينار أردني",f:1.411},{id:"kwd",l:"دينار كويتي",f:3.25},{id:"qar",l:"ريال قطري",f:.2747},{id:"bhd",l:"دينار بحريني",f:2.653},{id:"omr",l:"ريال عُماني",f:2.597},{id:"mad",l:"درهم مغربي",f:.0985}]}
];

var C=D[0];

function tmp(v,fr,to){var c;if(fr=="c")c=v;else if(fr=="f")c=(v-32)*5/9;else if(fr=="k")c=v-273.15;else c=(v-491.67)*5/9;if(to=="c")return c;if(to=="f")return c*9/5+32;if(to=="k")return c+273.15;return(c+273.15)*9/5;}
function fuel(v,fr,to){var lp;if(fr=="lp100")lp=v;else if(fr=="mpg_us")lp=235.215/v;else if(fr=="mpg_uk")lp=282.481/v;else lp=100/v;if(to=="lp100")return lp;if(to=="mpg_us")return 235.215/lp;if(to=="mpg_uk")return 282.481/lp;return 100/lp;}
function calc(v,fr,to){if(C.id=="temp")return tmp(v,fr,to);if(C.id=="fuel")return fuel(v,fr,to);var a=C.u.find(function(x){return x.id==fr;});var b=C.u.find(function(x){return x.id==to;});return v*a.f/b.f;}
function fmt(v){if(isNaN(v))return"—";if(Math.abs(v)>=1e12||(Math.abs(v)<1e-9&&v!=0))return v.toExponential(4);if(Math.abs(v)>=1000)return parseFloat(v.toPrecision(9)).toLocaleString();return parseFloat(v.toPrecision(9)).toString();}

function go(){
  var fi=document.getElementById("fu"),ti=document.getElementById("tu");
  var v=parseFloat(document.getElementById("fv").value);
  var re=document.getElementById("rt");
  if(isNaN(v)){document.getElementById("tv").value="";re.textContent="أدخل قيمة للتحويل";qs();return;}
  var r=calc(v,fi.value,ti.value);
  document.getElementById("tv").value=fmt(r);
  re.textContent=fmt(v)+" "+fi.options[fi.selectedIndex].text+" = "+fmt(r)+" "+ti.options[ti.selectedIndex].text;
  qs();
}
function goR(){
  var fi=document.getElementById("fu"),ti=document.getElementById("tu");
  var v=parseFloat(document.getElementById("tv").value);
  var re=document.getElementById("rt");
  if(isNaN(v)){document.getElementById("fv").value="";re.textContent="أدخل قيمة للتحويل";qs();return;}
  var r=calc(v,ti.value,fi.value);
  document.getElementById("fv").value=fmt(r);
  re.textContent=fmt(r)+" "+fi.options[fi.selectedIndex].text+" = "+fmt(v)+" "+ti.options[ti.selectedIndex].text;
  qs();
}
function sw(){var fi=document.getElementById("fu"),ti=document.getElementById("tu"),t=fi.value;fi.value=ti.value;ti.value=t;go();}
function cp(){
  var t=document.getElementById("rt").textContent;
  if(t&&t!="أدخل قيمة للتحويل"){
    navigator.clipboard.writeText(t).catch(function(){});
    var b=document.querySelector(".copy-btn");
    b.textContent="✅ تم";
    setTimeout(function(){b.textContent="📋 نسخ";},2000);
  }
}
function qs(){
  var fi=document.getElementById("fu"),fv=parseFloat(document.getElementById("fv").value)||1;
  var g=document.getElementById("qg");g.innerHTML="";
  C.u.filter(function(x){return x.id!=fi.value;}).slice(0,10).forEach(function(u){
    var r=calc(fv,fi.value,u.id),d=document.createElement("div");
    d.className="qcard";
    d.innerHTML="<div class='qu'>"+u.l+"</div><div class='qv'>"+fmt(r)+"</div>";
    d.onclick=function(){document.getElementById("tu").value=u.id;go();};
    g.appendChild(d);
  });
}
function load(cat){
  C=cat;
  document.querySelectorAll(".cats button").forEach(function(b){b.classList.remove("active");});
  document.getElementById("c-"+cat.id).classList.add("active");
  var fi=document.getElementById("fu"),ti=document.getElementById("tu");
  fi.innerHTML="";ti.innerHTML="";
  cat.u.forEach(function(u){
    fi.innerHTML+="<option value='"+u.id+"'>"+u.l+"</option>";
    ti.innerHTML+="<option value='"+u.id+"'>"+u.l+"</option>";
  });
  ti.selectedIndex=1;
  document.getElementById("fv").value=1;
  document.getElementById("tv").value="";
  go();
}
(function(){
  var el=document.getElementById("cats");
  D.forEach(function(cat){
    var b=document.createElement("button");
    b.id="c-"+cat.id;
    b.textContent=cat.lb;
    b.onclick=function(){load(cat);};
    el.appendChild(b);
  });
  load(D[0]);
})();
</script>
</body>
</html>
